name: NOVA Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build NOVA APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find NOVA source ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="NOVA_Sinhala_AI_COMPLETE_V3_ZIP_UPLOAD.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found."
            echo ""
            echo "Files in repository:"
            find . -maxdepth 2 -type f -print | sort
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          echo "file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Validate ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VALIDATING NOVA SOURCE ZIP"
          echo "=========================================="

          unzip -t "$ZIP_FILE" 2>/dev/null || unzip -t "NOVA_Sinhala_AI_COMPLETE_V3_ZIP_UPLOAD.zip"

          echo "ZIP validation successful."

      - name: Extract NOVA project
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "EXTRACTING NOVA PROJECT"
          echo "=========================================="

          rm -rf nova-source
          mkdir -p nova-source

          unzip -q \
            "NOVA_Sinhala_AI_COMPLETE_V3_ZIP_UPLOAD.zip" \
            -d nova-source

          echo "NOVA project extracted."

          echo ""
          echo "Top-level extracted directories:"
          find nova-source -maxdepth 3 -type d | sort | head -200

      - name: Locate Android project
        id: android
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "LOCATING ANDROID PROJECT"
          echo "=========================================="

          ANDROID_DIR=""

          if [ -f "nova-source/android/settings.gradle.kts" ] && \
             [ -f "nova-source/android/build.gradle.kts" ] && \
             [ -f "nova-source/android/app/build.gradle.kts" ]; then

            ANDROID_DIR="nova-source/android"

          else

            ROOT="$(
              find nova-source \
                -type f \
                -name "settings.gradle.kts" \
                -print \
                | while read -r SETTINGS; do
                    DIR="$(dirname "$SETTINGS")"

                    if [ -f "$DIR/build.gradle.kts" ] && \
                       [ -f "$DIR/app/build.gradle.kts" ]; then
                      echo "$DIR"
                      break
                    fi
                  done
            )"

            if [ -z "$ROOT" ]; then
              echo "ERROR: Android Gradle project was not found."
              echo ""
              echo "Gradle settings files found:"
              find nova-source \
                -type f \
                -name "settings.gradle*" \
                -print \
                | sort

              echo ""
              echo "Android directories found:"
              find nova-source \
                -type d \
                -name android \
                -print \
                | sort

              exit 1
            fi

            ANDROID_DIR="$ROOT"
          fi

          echo "Android project:"
          echo "$ANDROID_DIR"

          test -d "$ANDROID_DIR"
          test -f "$ANDROID_DIR/settings.gradle.kts"
          test -f "$ANDROID_DIR/build.gradle.kts"
          test -f "$ANDROID_DIR/app/build.gradle.kts"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFYING BUILD ENVIRONMENT"
          echo "=========================================="

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          gradle --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate NOVA backend
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VALIDATING NOVA BACKEND"
          echo "=========================================="

          if [ -d "nova-source/server/nova_api" ]; then

            python -m compileall \
              -q \
              nova-source/server/nova_api

            echo "Backend validation successful."

          elif [ -d "nova-source/nova/server/nova_api" ]; then

            python -m compileall \
              -q \
              nova-source/nova/server/nova_api

            echo "Backend validation successful."

          else

            echo "Backend directory not found."
            echo "Continuing with Android build."

          fi

      - name: Verify VoiceService source
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFYING VOICE SERVICE SOURCE"
          echo "=========================================="

          VOICE_FILE="$ANDROID_DIR/app/src/main/java/com/nova/assistant/VoiceService.kt"

          if [ ! -f "$VOICE_FILE" ]; then
            echo "ERROR: VoiceService.kt was not found:"
            echo "$VOICE_FILE"
            exit 1
          fi

          echo "VoiceService:"
          echo "$VOICE_FILE"

          echo ""
          echo "Checking media action implementation..."

          if grep -nE 'AccessibilityService\.GLOBAL_ACTION_MEDIA_PLAY_PAUSE|GLOBAL_ACTION_MEDIA_PLAY_PAUSE|GLOBAL_ACTION_PLAY_PAUSE' "$VOICE_FILE"; then
            echo ""
            echo "ERROR: Unsupported direct media global-action symbol still exists in VoiceService.kt."
            echo "Remove the direct symbol reference before compiling."
            exit 1
          fi

          if ! grep -nE 'mediaPlayPauseGlobalAction[[:space:]]*=[[:space:]]*22' "$VOICE_FILE"; then
            echo ""
            echo "ERROR: Numeric media play/pause action implementation was not found."
            exit 1
          fi

          if ! grep -nE 'VERSION\.SDK_INT[[:space:]]*>=[[:space:]]*36' "$VOICE_FILE"; then
            echo ""
            echo "ERROR: Android API 36 runtime guard was not found."
            exit 1
          fi

          echo ""
          echo "VoiceService source validation successful."

      - name: Verify no unsupported media API references
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CHECKING SOURCE FOR UNSUPPORTED MEDIA API"
          echo "=========================================="

          SEARCH_ROOT="$ANDROID_DIR/app/src/main/java"

          if grep -RInE \
            --include="*.kt" \
            --include="*.java" \
            'GLOBAL_ACTION_MEDIA_PLAY_PAUSE|GLOBAL_ACTION_PLAY_PAUSE' \
            "$SEARCH_ROOT"; then

            echo ""
            echo "ERROR: Unsupported media global-action symbol found in Android source."
            echo "The build must use the numeric action ID instead."
            exit 1

          fi

          echo "No unsupported media global-action symbols found."

      - name: Show VoiceService media implementation
        shell: bash
        run: |
          set -euo pipefail

          VOICE_FILE="$ANDROID_DIR/app/src/main/java/com/nova/assistant/VoiceService.kt"

          echo "=========================================="
          echo "VOICE SERVICE MEDIA IMPLEMENTATION"
          echo "=========================================="

          LINE="$(
            grep -n \
              -m 1 \
              'mediaPlayPauseGlobalAction' \
              "$VOICE_FILE" \
              | cut -d: -f1 \
              || true
          )"

          if [ -n "$LINE" ]; then

            START=$((LINE - 12))

            if [ "$START" -lt 1 ]; then
              START=1
            fi

            END=$((LINE + 18))

            sed -n "${START},${END}p" "$VOICE_FILE"

          else

            echo "Media implementation not found."
            exit 1

          fi

      - name: Clean previous Android build
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CLEANING PREVIOUS BUILD"
          echo "=========================================="

          gradle clean \
            --no-daemon

      - name: Build NOVA Debug APK
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "STARTING NOVA ANDROID BUILD"
          echo "=========================================="

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          echo ""
          echo "=========================================="
          echo "GRADLE BUILD COMPLETED"
          echo "=========================================="

      - name: Find generated APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "SEARCHING FOR GENERATED APK"
          echo "=========================================="

          OUTPUT_DIR="$ANDROID_DIR/app/build/outputs"

          if [ ! -d "$OUTPUT_DIR" ]; then
            echo "ERROR: Build outputs directory does not exist:"
            echo "$OUTPUT_DIR"
            exit 1
          fi

          echo ""
          echo "Generated APK files:"

          find "$OUTPUT_DIR" \
            -type f \
            -name "*.apk" \
            -print \
            | sort

          APK_COUNT="$(
            find "$OUTPUT_DIR" \
              -type f \
              -name "*.apk" \
              | wc -l
          )"

          APK_COUNT="$(echo "$APK_COUNT" | tr -d ' ')"

          echo ""
          echo "APK count: $APK_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo ""
            echo "ERROR: No APK was generated."

            echo ""
            echo "Build output directory:"
            find "$OUTPUT_DIR" \
              -maxdepth 5 \
              -type f \
              -print \
              | sort

            exit 1
          fi

          APK_FILE="$(
            find "$OUTPUT_DIR" \
              -type f \
              -name "*.apk" \
              | sort \
              | head -n 1
          )"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK path could not be determined."
            exit 1
          fi

          echo ""
          echo "Selected APK:"
          echo "$APK_FILE"

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

      - name: Verify APK file
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFYING APK"
          echo "=========================================="

          if [ -z "${APK_FILE:-}" ]; then
            echo "ERROR: APK_FILE is not set."
            exit 1
          fi

          if [ ! -f "$APK_FILE" ]; then
            echo "ERROR: APK file does not exist:"
            echo "$APK_FILE"
            exit 1
          fi

          APK_SIZE="$(stat -c%s "$APK_FILE")"

          if [ "$APK_SIZE" -le 0 ]; then
            echo "ERROR: APK file is empty."
            exit 1
          fi

          echo "APK:"
          echo "$APK_FILE"

          echo ""
          echo "APK size:"
          echo "$APK_SIZE bytes"

          echo ""
          echo "APK verification successful."

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "PREPARING APK ARTIFACT"
          echo "=========================================="

          mkdir -p artifacts

          cp "$APK_FILE" \
            "artifacts/NOVA-debug.apk"

          test -f "artifacts/NOVA-debug.apk"

          echo "Artifact prepared:"
          ls -lh "artifacts/NOVA-debug.apk"

      - name: Upload NOVA APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-debug-APK
          path: artifacts/NOVA-debug.apk
          if-no-files-found: error
          compression-level: 0

      - name: NOVA Build Summary
        if: success()
        shell: bash
        run: |
          echo "=========================================="
          echo "NOVA BUILD SUCCESSFUL"
          echo "=========================================="
          echo ""
          echo "Android project:"
          echo "$ANDROID_DIR"
          echo ""
          echo "APK:"
          echo "artifacts/NOVA-debug.apk"
          echo ""
          echo "Artifact:"
          echo "NOVA-debug-APK"
          echo ""
          echo "=========================================="
