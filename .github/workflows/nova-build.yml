name: NOVA Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build NOVA APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find NOVA source ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="NOVA_Sinhala_AI_COMPLETE_V3_ZIP_UPLOAD.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found."
            echo ""
            echo "Files in repository:"
            ls -la
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          echo "file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Validate ZIP
        shell: bash
        run: |
          set -euo pipefail

          unzip -t \
            "NOVA_Sinhala_AI_COMPLETE_V3_ZIP_UPLOAD.zip"

      - name: Extract NOVA project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf nova-source
          mkdir -p nova-source

          unzip -q \
            "NOVA_Sinhala_AI_COMPLETE_V3_ZIP_UPLOAD.zip" \
            -d nova-source

          echo "NOVA project extracted."

      - name: Locate Android project
        id: android
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "nova-source/android" ]; then
            ANDROID_DIR="nova-source/android"
          else
            ROOT="$(
              find nova-source \
                -mindepth 1 \
                -maxdepth 2 \
                -type d \
                -name android \
                | head -n 1
            )"

            if [ -z "$ROOT" ]; then
              echo "ERROR: Android project not found."
              find nova-source -maxdepth 3 -type d | sort
              exit 1
            fi

            ANDROID_DIR="$ROOT"
          fi

          echo "Android project: $ANDROID_DIR"

          test -d "$ANDROID_DIR"
          test -f "$ANDROID_DIR/settings.gradle.kts"
          test -f "$ANDROID_DIR/build.gradle.kts"
          test -f "$ANDROID_DIR/app/build.gradle.kts"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -euo pipefail

          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          gradle --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate NOVA backend
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "nova-source/server/nova_api" ]; then
            python -m compileall nova-source/server/nova_api
          else
            echo "Backend directory not found."
            echo "Continuing with Android build."
          fi

      - name: Build NOVA Debug APK
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "STARTING NOVA ANDROID BUILD"
          echo "=========================================="

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find generated APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Generated APK files:"

          find "$ANDROID_DIR/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT="$(
            find "$ANDROID_DIR/app/build/outputs" \
              -type f \
              -name "*.apk" \
              | wc -l
          )"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

      - name: Upload NOVA APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-debug-APK
          path: "nova-source/android/app/build/outputs/apk/**/*.apk"
          if-no-files-found: error

      - name: NOVA Build Summary
        if: success()
        run: |
          echo "=========================================="
          echo "NOVA BUILD SUCCESSFUL"
          echo "=========================================="
          echo "APK artifact: NOVA-debug-APK"
