name: NOVA Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build NOVA APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate NOVA source ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "SEARCHING FOR NOVA SOURCE ZIP"
          echo "=========================================="

          ZIP_FILE=""

          for candidate in \
            "NOVA_Sinhala_AI_COMPLETE_V4_FIXED7_OPENROUTER_UNIVERSAL_HUMAN_AGENT_V15_GROQ_5KEY_FAILOVER_BUILD_FIXED4.zip" \
            "NOVA_Sinhala_AI_COMPLETE_V4_FIXED7_OPENROUTER_UNIVERSAL_HUMAN_AGENT_V15_GROQ_5KEY_FAILOVER_BUILD_FIXED3.zip" \
            "NOVA_Sinhala_AI_COMPLETE_V4_FIXED7_OPENROUTER_UNIVERSAL_HUMAN_AGENT_V15_GROQ_5KEY_FAILOVER_BUILD_FIXED2.zip" \
            "NOVA_Sinhala_AI_COMPLETE_V4_FIXED7_OPENROUTER_UNIVERSAL_HUMAN_AGENT_V15_GROQ_5KEY_FAILOVER_BUILD_FIXED.zip"
          do
            if [ -f "$candidate" ]; then
              ZIP_FILE="$candidate"
              break
            fi
          done

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No NOVA FIXED source ZIP was found."
            echo ""
            echo "Repository files:"
            find . -maxdepth 2 -type f -print | sort
            exit 1
          fi

          echo "Using NOVA source:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Validate NOVA ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VALIDATING NOVA ZIP"
          echo "=========================================="

          unzip -t "$ZIP_FILE"

      - name: Extract NOVA project
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "EXTRACTING NOVA PROJECT"
          echo "=========================================="

          rm -rf nova-source
          mkdir -p nova-source

          unzip -q "$ZIP_FILE" -d nova-source

          echo "Extraction complete."

          echo ""
          echo "Extracted directories:"
          find nova-source -maxdepth 3 -type d | sort

      - name: Locate Android project
        id: android
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "LOCATING ANDROID PROJECT"
          echo "=========================================="

          ANDROID_DIR=""

          if [ -f "nova-source/android/settings.gradle.kts" ] && \
             [ -f "nova-source/android/app/build.gradle.kts" ]; then
            ANDROID_DIR="nova-source/android"
          else
            ROOT="$(
              find nova-source \
                -type f \
                -name "settings.gradle.kts" \
                -print \
                | while read -r SETTINGS; do
                    DIR="$(dirname "$SETTINGS")"

                    if [ -f "$DIR/app/build.gradle.kts" ]; then
                      echo "$DIR"
                      break
                    fi
                  done
            )"

            if [ -z "$ROOT" ]; then
              echo "ERROR: Android Gradle project not found."

              echo ""
              echo "Gradle files found:"
              find nova-source \
                -type f \
                \( -name "settings.gradle.kts" -o -name "build.gradle.kts" \) \
                -print \
                | sort

              exit 1
            fi

            ANDROID_DIR="$ROOT"
          fi

          echo "Android project:"
          echo "$ANDROID_DIR"

          test -d "$ANDROID_DIR"
          test -f "$ANDROID_DIR/settings.gradle.kts"
          test -f "$ANDROID_DIR/build.gradle.kts"
          test -f "$ANDROID_DIR/app/build.gradle.kts"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      - name: Verify NOVA VoiceService source
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFYING VOICE SERVICE SOURCE"
          echo "=========================================="

          VOICE_FILE="$ANDROID_DIR/app/src/main/java/com/nova/assistant/VoiceService.kt"

          if [ ! -f "$VOICE_FILE" ]; then
            echo "ERROR: VoiceService.kt was not found."
            exit 1
          fi

          echo "VoiceService:"
          echo "$VOICE_FILE"

          echo ""
          echo "Relevant media-action references:"
          grep -n -E \
            "GLOBAL_ACTION_MEDIA_PLAY_PAUSE|GLOBAL_ACTION_PLAY_PAUSE|mediaPlayPauseGlobalAction" \
            "$VOICE_FILE" || true

          echo ""
          echo "Lines around media action implementation:"
          nl -ba "$VOICE_FILE" | sed -n '700,735p'

          echo ""
          echo "Checking for invalid direct API reference..."

          if grep -n "GLOBAL_ACTION_MEDIA_PLAY_PAUSE" "$VOICE_FILE"; then
            echo ""
            echo "ERROR: GLOBAL_ACTION_MEDIA_PLAY_PAUSE is still directly referenced."
            echo "The source being compiled is not the fixed implementation."
            exit 1
          fi

          if grep -n "GLOBAL_ACTION_PLAY_PAUSE" "$VOICE_FILE"; then
            echo ""
            echo "ERROR: GLOBAL_ACTION_PLAY_PAUSE is still directly referenced."
            echo "The source being compiled is not the fixed implementation."
            exit 1
          fi

          echo ""
          echo "VoiceService source verification PASSED."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "JAVA VERSION"
          echo "=========================================="

          java -version

          echo ""
          echo "=========================================="
          echo "GRADLE VERSION"
          echo "=========================================="

          gradle --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate NOVA backend
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "nova-source/server/nova_api" ]; then
            echo "Validating Python backend..."
            python -m compileall nova-source/server/nova_api
          else
            echo "Backend directory not found."
            echo "Continuing with Android build."
          fi

      - name: Prepare Gradle wrapper
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle wrapper found."
          else
            echo "Gradle wrapper not found."
            echo "Using installed Gradle 8.9."
          fi

      - name: Clean NOVA Android project
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CLEANING NOVA ANDROID PROJECT"
          echo "=========================================="

          gradle clean --no-daemon --stacktrace

      - name: Build NOVA Debug APK
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "STARTING NOVA ANDROID BUILD"
          echo "=========================================="

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          echo ""
          echo "=========================================="
          echo "GRADLE BUILD COMPLETED"
          echo "=========================================="

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "SEARCHING FOR GENERATED APK"
          echo "=========================================="

          APK_ROOT="$ANDROID_DIR/app/build/outputs/apk"

          if [ ! -d "$APK_ROOT" ]; then
            echo "ERROR: APK output directory does not exist:"
            echo "$APK_ROOT"
            exit 1
          fi

          echo ""
          echo "APK files found:"

          find "$APK_ROOT" \
            -type f \
            -name "*.apk" \
            -print \
            | sort

          APK_COUNT="$(
            find "$APK_ROOT" \
              -type f \
              -name "*.apk" \
              | wc -l
          )"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo ""
            echo "ERROR: Build completed but no APK was generated."
            exit 1
          fi

          echo ""
          echo "APK COUNT: $APK_COUNT"

          FIRST_APK="$(
            find "$APK_ROOT" \
              -type f \
              -name "*.apk" \
              -print \
              | sort \
              | head -n 1
          )"

          echo ""
          echo "Primary APK:"
          echo "$FIRST_APK"

          echo "APK_PATH=$FIRST_APK" >> "$GITHUB_ENV"

      - name: Upload NOVA APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-debug-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: NOVA Build Summary
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "NOVA BUILD SUCCESSFUL"
          echo "=========================================="

          echo ""
          echo "Source ZIP:"
          echo "$ZIP_FILE"

          echo ""
          echo "Android project:"
          echo "$ANDROID_DIR"

          echo ""
          echo "APK:"
          echo "$APK_PATH"

          echo ""
          echo "Artifact:"
          echo "NOVA-debug-APK"

          echo ""
          echo "=========================================="
          echo "BUILD COMPLETE"
          echo "=========================================="
