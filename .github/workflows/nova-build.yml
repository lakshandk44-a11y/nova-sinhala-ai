name: NOVA Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build NOVA APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. FIND NOVA ZIP
      # ============================================================
      - name: Find NOVA source ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "SEARCHING FOR NOVA SOURCE ZIP"
          echo "=========================================="

          ZIP_FILE=""

          # Exact current ZIP name
          if [ -f "NOVA_Sinhala_AI_COMPLETE_V4_FIXED7_OPENROUTER_UNIVERSAL_HUMAN_AGENT_V15_GROQ_5KEY_FAILOVER_BUILD_FIXED4.zip" ]; then
            ZIP_FILE="NOVA_Sinhala_AI_COMPLETE_V4_FIXED7_OPENROUTER_UNIVERSAL_HUMAN_AGENT_V15_GROQ_5KEY_FAILOVER_BUILD_FIXED4.zip"
          fi

          # Fallback: find any NOVA zip in repository root
          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(
              find . \
                -maxdepth 1 \
                -type f \
                -iname "*.zip" \
                -printf "%f\n" \
                | grep -i "NOVA" \
                | head -n 1 \
                || true
            )"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No NOVA ZIP file was found."
            echo ""
            echo "ZIP files available in repository:"
            find . \
              -maxdepth 2 \
              -type f \
              -iname "*.zip" \
              -print \
              | sort || true
            echo ""
            echo "Repository root:"
            ls -la
            exit 1
          fi

          echo "Found NOVA ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "file=$ZIP_FILE" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 3. VALIDATE ZIP
      # ============================================================
      - name: Validate NOVA ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VALIDATING NOVA ZIP"
          echo "=========================================="

          test -f "$ZIP_FILE"

          unzip -t "$ZIP_FILE"

          echo ""
          echo "ZIP validation successful."


      # ============================================================
      # 4. EXTRACT NOVA PROJECT
      # ============================================================
      - name: Extract NOVA project
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "EXTRACTING NOVA PROJECT"
          echo "=========================================="

          rm -rf nova-source
          mkdir -p nova-source

          unzip -q "$ZIP_FILE" -d nova-source

          echo ""
          echo "Extraction completed."

          echo ""
          echo "Top-level extracted directories:"
          find nova-source \
            -maxdepth 3 \
            -type d \
            | sort \
            | head -n 100


      # ============================================================
      # 5. LOCATE ANDROID PROJECT
      # ============================================================
      - name: Locate Android project
        id: android
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "LOCATING ANDROID PROJECT"
          echo "=========================================="

          ANDROID_DIR=""

          # Direct location
          if [ -d "nova-source/android" ]; then
            ANDROID_DIR="nova-source/android"
          fi

          # Common nested location
          if [ -z "$ANDROID_DIR" ] && [ -d "nova-source/nova/android" ]; then
            ANDROID_DIR="nova-source/nova/android"
          fi

          # Generic search
          if [ -z "$ANDROID_DIR" ]; then
            ANDROID_DIR="$(
              find nova-source \
                -type d \
                -name android \
                -print \
                | while read -r DIR; do
                    if [ -f "$DIR/settings.gradle.kts" ] || \
                       [ -f "$DIR/settings.gradle" ]; then
                      echo "$DIR"
                      break
                    fi
                  done
            )"
          fi

          if [ -z "$ANDROID_DIR" ]; then
            echo "ERROR: Android project could not be located."

            echo ""
            echo "Possible Android directories:"
            find nova-source \
              -type d \
              -name android \
              -print \
              | sort || true

            echo ""
            echo "Gradle files:"
            find nova-source \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
                -o \
                -name "build.gradle" \
                -o \
                -name "build.gradle.kts" \
              \) \
              -print \
              | sort \
              | head -n 200 || true

            exit 1
          fi

          echo "Android project:"
          echo "$ANDROID_DIR"

          test -d "$ANDROID_DIR"
          test -d "$ANDROID_DIR/app"

          if [ ! -f "$ANDROID_DIR/settings.gradle.kts" ] && \
             [ ! -f "$ANDROID_DIR/settings.gradle" ]; then
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi

          if [ ! -f "$ANDROID_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$ANDROID_DIR/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle file not found."
            exit 1
          fi

          echo ""
          echo "Android project validation successful."

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "android_dir=$ANDROID_DIR" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 6. CHECK VOICE SERVICE SOURCE
      # ============================================================
      - name: Verify VoiceService source
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFYING VOICE SERVICE SOURCE"
          echo "=========================================="

          VOICE_FILE="$ANDROID_DIR/app/src/main/java/com/nova/assistant/VoiceService.kt"

          if [ ! -f "$VOICE_FILE" ]; then
            echo "WARNING: VoiceService.kt was not found at:"
            echo "$VOICE_FILE"
            echo ""
            echo "Continuing with Android build."
            exit 0
          fi

          echo "VoiceService:"
          echo "$VOICE_FILE"

          echo ""
          echo "Checking for forbidden direct media-action API references..."

          # The compiler error previously came from a direct reference to
          # GLOBAL_ACTION_MEDIA_PLAY_PAUSE.
          #
          # We intentionally fail here only if actual Kotlin code contains
          # a direct reference, while ignoring comments.
          #
          # Remove // comments before checking.

          CODE_WITHOUT_COMMENTS="$(
            sed \
              -E 's/[[:space:]]*\/\/.*$//' \
              "$VOICE_FILE"
          )"

          if printf '%s\n' "$CODE_WITHOUT_COMMENTS" \
              | grep -qE 'AccessibilityService[[:space:]]*\.[[:space:]]*GLOBAL_ACTION_MEDIA_PLAY_PAUSE'; then

            echo ""
            echo "ERROR: Direct GLOBAL_ACTION_MEDIA_PLAY_PAUSE reference found."
            echo ""
            echo "The VoiceService source must use the numeric API-safe"
            echo "implementation instead of directly referencing the API field."
            echo ""
            exit 1
          fi

          if printf '%s\n' "$CODE_WITHOUT_COMMENTS" \
              | grep -qE 'AccessibilityService[[:space:]]*\.[[:space:]]*GLOBAL_ACTION_PLAY_PAUSE'; then

            echo ""
            echo "ERROR: Direct GLOBAL_ACTION_PLAY_PAUSE reference found."
            echo ""
            exit 1
          fi

          echo "No forbidden direct media-action API reference found."
          echo "VoiceService source check passed."


      # ============================================================
      # 7. JAVA 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ============================================================
      # 8. GRADLE 8.9
      # ============================================================
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"


      # ============================================================
      # 9. VERIFY JAVA + GRADLE
      # ============================================================
      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "JAVA VERSION"
          echo "=========================================="

          java -version

          echo ""
          echo "=========================================="
          echo "GRADLE VERSION"
          echo "=========================================="

          gradle --version


      # ============================================================
      # 10. PYTHON
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ============================================================
      # 11. VALIDATE BACKEND IF PRESENT
      # ============================================================
      - name: Validate NOVA backend
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VALIDATING NOVA BACKEND"
          echo "=========================================="

          if [ -d "nova-source/server/nova_api" ]; then

            echo "Backend found:"
            echo "nova-source/server/nova_api"

            python -m compileall \
              nova-source/server/nova_api

            echo ""
            echo "Backend validation successful."

          elif [ -d "nova-source/nova/server/nova_api" ]; then

            echo "Backend found:"
            echo "nova-source/nova/server/nova_api"

            python -m compileall \
              nova-source/nova/server/nova_api

            echo ""
            echo "Backend validation successful."

          else

            echo "Backend directory not found."
            echo "Continuing with Android build."

          fi


      # ============================================================
      # 12. CHECK GRADLE WRAPPER
      # ============================================================
      - name: Prepare Gradle build
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "PREPARING GRADLE BUILD"
          echo "=========================================="

          if [ -f "./gradlew" ]; then
            echo "Gradle wrapper found."

            chmod +x ./gradlew

            echo ""
            echo "Gradle wrapper version:"
            ./gradlew --version

            echo "USE_WRAPPER=true" >> "$GITHUB_ENV"

          else
            echo "Gradle wrapper not found."
            echo "Using installed Gradle 8.9."

            echo "USE_WRAPPER=false" >> "$GITHUB_ENV"
          fi


      # ============================================================
      # 13. BUILD DEBUG APK
      # ============================================================
      - name: Build NOVA Debug APK
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "STARTING NOVA ANDROID BUILD"
          echo "=========================================="

          echo ""
          echo "Android directory:"
          pwd

          echo ""
          echo "Java:"
          java -version

          echo ""

          if [ "${USE_WRAPPER:-false}" = "true" ]; then

            echo "Using Gradle wrapper."

            ./gradlew \
              clean \
              assembleDebug \
              --no-daemon \
              --stacktrace

          else

            echo "Using installed Gradle 8.9."

            gradle \
              clean \
              assembleDebug \
              --no-daemon \
              --stacktrace

          fi

          echo ""
          echo "=========================================="
          echo "ANDROID BUILD COMMAND FINISHED"
          echo "=========================================="


      # ============================================================
      # 14. FIND GENERATED APK
      # ============================================================
      - name: Find generated APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "SEARCHING FOR GENERATED APK"
          echo "=========================================="

          APK_DIR="$ANDROID_DIR/app/build/outputs/apk"

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: APK output directory does not exist:"
            echo "$APK_DIR"

            echo ""
            echo "Available build outputs:"
            find "$ANDROID_DIR/app/build/outputs" \
              -maxdepth 5 \
              -type f \
              -print \
              | sort || true

            exit 1
          fi

          echo "APK output directory:"
          echo "$APK_DIR"

          echo ""
          echo "Generated APK files:"

          find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            -print \
            | sort

          APK_FILE="$(
            find "$APK_DIR" \
              -type f \
              -name "*.apk" \
              -print \
              | sort \
              | head -n 1
          )"

          if [ -z "$APK_FILE" ]; then
            echo ""
            echo "ERROR: No APK was generated."

            echo ""
            echo "Complete app build output:"
            find "$ANDROID_DIR/app/build" \
              -maxdepth 8 \
              -type f \
              -print \
              | sort \
              | head -n 300 || true

            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK_FILE"

          APK_ABSOLUTE="$(realpath "$APK_FILE")"

          echo ""
          echo "APK absolute path:"
          echo "$APK_ABSOLUTE"

          echo "APK_FILE=$APK_ABSOLUTE" >> "$GITHUB_ENV"
          echo "apk_file=$APK_ABSOLUTE" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 15. VERIFY APK
      # ============================================================
      - name: Verify generated APK
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFYING GENERATED APK"
          echo "=========================================="

          test -f "$APK_FILE"
          test -s "$APK_FILE"

          APK_SIZE="$(stat -c%s "$APK_FILE")"

          echo "APK:"
          echo "$APK_FILE"

          echo ""
          echo "APK size:"
          echo "$APK_SIZE bytes"

          if [ "$APK_SIZE" -lt 10000 ]; then
            echo ""
            echo "ERROR: APK is unexpectedly small."
            exit 1
          fi

          echo ""
          echo "APK verification successful."


      # ============================================================
      # 16. COPY APK TO SIMPLE OUTPUT LOCATION
      # ============================================================
      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "PREPARING APK ARTIFACT"
          echo "=========================================="

          rm -rf artifact
          mkdir -p artifact

          cp "$APK_FILE" \
            "artifact/NOVA-debug.apk"

          test -f "artifact/NOVA-debug.apk"
          test -s "artifact/NOVA-debug.apk"

          echo "Artifact prepared:"
          ls -lh artifact/NOVA-debug.apk


      # ============================================================
      # 17. UPLOAD APK
      # ============================================================
      - name: Upload NOVA APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-debug-APK
          path: artifact/NOVA-debug.apk
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 18. BUILD SUMMARY
      # ============================================================
      - name: NOVA Build Summary
        if: success()
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "NOVA BUILD SUCCESSFUL"
          echo "=========================================="
          echo ""
          echo "Android project:"
          echo "$ANDROID_DIR"
          echo ""
          echo "APK:"
          echo "artifact/NOVA-debug.apk"
          echo ""
          echo "GitHub Actions artifact:"
          echo "NOVA-debug-APK"
          echo ""
          echo "=========================================="
