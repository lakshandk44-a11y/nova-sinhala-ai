name: NOVA Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build NOVA APK
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # 2. Find the exact NOVA ZIP
      # ---------------------------------------------------------
      - name: Find NOVA source ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="NOVA_Sinhala_AI_COMPLETE_V3_ZIP_UPLOAD.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found."
            echo ""
            echo "Files currently in repository:"
            ls -la
            echo ""
            exit 1
          fi

          echo "=========================================="
          echo "NOVA ZIP FOUND"
          echo "=========================================="
          echo "$ZIP_FILE"
          echo "=========================================="

          echo "file=$ZIP_FILE" >> "$GITHUB_OUTPUT"


      # ---------------------------------------------------------
      # 3. Validate ZIP
      # ---------------------------------------------------------
      - name: Validate NOVA ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Validating ZIP..."

          unzip -t \
            "NOVA_Sinhala_AI_COMPLETE_V3_ZIP_UPLOAD.zip"

          echo "ZIP validation successful."


      # ---------------------------------------------------------
      # 4. Extract complete NOVA project
      # ---------------------------------------------------------
      - name: Extract NOVA project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf nova-source

          mkdir -p nova-source

          unzip -q \
            "NOVA_Sinhala_AI_COMPLETE_V3_ZIP_UPLOAD.zip" \
            -d nova-source

          echo ""
          echo "=========================================="
          echo "NOVA PROJECT EXTRACTED"
          echo "=========================================="

          find nova-source -maxdepth 3 -type f | sort

          echo "=========================================="


      # ---------------------------------------------------------
      # 5. Locate Android project
      # ---------------------------------------------------------
      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "nova-source/android" ]; then

            echo "ANDROID_DIR=nova-source/android" \
              >> "$GITHUB_ENV"

          else

            ROOT="$(
              find nova-source \
                -mindepth 1 \
                -maxdepth 2 \
                -type d \
                -name android \
                | head -n 1
            )"

            if [ -z "$ROOT" ]; then

              echo "ERROR: Android project was not found."

              echo ""
              echo "Directories found:"
              find nova-source \
                -maxdepth 3 \
                -type d \
                | sort

              exit 1
            fi

            echo "ANDROID_DIR=$(dirname "$ROOT")/android" \
              >> "$GITHUB_ENV"

          fi

          echo ""
          echo "Android project:"
          echo "$ANDROID_DIR"


      # ---------------------------------------------------------
      # 6. Validate Android project
      # ---------------------------------------------------------
      - name: Validate Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Android project..."

          test -d "$ANDROID_DIR"

          test -f \
            "$ANDROID_DIR/settings.gradle.kts"

          test -f \
            "$ANDROID_DIR/build.gradle.kts"

          test -f \
            "$ANDROID_DIR/app/build.gradle.kts"

          echo ""
          echo "Android project structure is present."

          echo ""
          echo "Android files:"
          find "$ANDROID_DIR" \
            -maxdepth 3 \
            -type f \
            | sort


      # ---------------------------------------------------------
      # 7. Setup Java 17
      # ---------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ---------------------------------------------------------
      # 8. Setup Gradle 8.9
      # ---------------------------------------------------------
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"


      # ---------------------------------------------------------
      # 9. Verify Java / Gradle
      # ---------------------------------------------------------
      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "JAVA"
          echo "=========================================="

          java -version

          echo ""
          echo "=========================================="
          echo "GRADLE"
          echo "=========================================="

          gradle --version

          echo "=========================================="


      # ---------------------------------------------------------
      # 10. Backend Python validation
      # ---------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Validate NOVA backend
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "nova-source/server/nova_api" ]; then

            python -m compileall \
              "nova-source/server/nova_api"

          else

            echo "Backend directory not found."
            echo "Continuing Android build."

          fi


      # ---------------------------------------------------------
      # 11. Build Android Debug APK
      #
      # IMPORTANT:
      # This intentionally uses installed Gradle.
      # It does NOT require gradlew.
      # ---------------------------------------------------------
      - name: Build NOVA Debug APK
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "STARTING NOVA ANDROID BUILD"
          echo "=========================================="

          gradle \
            assembleDebug \
            --no-daemon \
            --stacktrace

          echo "=========================================="
          echo "ANDROID BUILD FINISHED"
          echo "=========================================="


      # ---------------------------------------------------------
      # 12. Find generated APK
      # ---------------------------------------------------------
      - name: Find generated APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for APK..."

          find "$ANDROID_DIR/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT="$(
            find "$ANDROID_DIR/app/build/outputs" \
              -type f \
              -name "*.apk" \
              | wc -l
          )"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo ""
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo ""
          echo "APK generated successfully."


      # ---------------------------------------------------------
      # 13. Upload APK as GitHub Actions Artifact
      # ---------------------------------------------------------
      - name: Upload NOVA APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-debug-APK
          path: |
            nova-source/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error


      # ---------------------------------------------------------
      # 14. Build summary
      # ---------------------------------------------------------
      - name: NOVA Build Summary
        if: success()
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "        NOVA BUILD SUCCESSFUL"
          echo "=========================================="
          echo ""
          echo "ZIP:"
          echo "NOVA_Sinhala_AI_COMPLETE_V3_ZIP_UPLOAD.zip"
          echo ""
          echo "Android build:"
          echo "assembleDebug"
          echo ""
          echo "APK artifact:"
          echo "NOVA-debug-APK"
          echo ""
          echo "=========================================="
